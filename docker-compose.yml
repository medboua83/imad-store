# Local development only. Production uses a dedicated restricted runtime role.
# Set POSTGRES_PASSWORD explicitly before starting; no default credential is shipped.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-imad_store}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a unique local database password}
      POSTGRES_DB: ${POSTGRES_DB:-imad_store}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  adminer:
    image: adminer
    profiles: [tools]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ADMINER_PORT:-8080}:8080"
    depends_on:
      - db

volumes:
  postgres_data:
