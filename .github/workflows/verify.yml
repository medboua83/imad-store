name: Verify store
on:
    push:
        branches: [Master]
    pull_request:
permissions:
    contents: read
jobs:
    verify:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - run: npm --prefix backend run prisma:generate
            - name: Start isolated MongoDB replica set
              run: |
                  docker run -d --name imad-mongo -p 27017:27017 mongo:7 --replSet rs0 --bind_ip_all
                  for attempt in $(seq 1 30); do
                    if docker exec imad-mongo mongosh --quiet --eval 'db.adminCommand({ping:1}).ok' >/dev/null 2>&1; then break; fi
                    sleep 1
                  done
                  docker exec imad-mongo mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"127.0.0.1:27017"}]})'
                  for attempt in $(seq 1 30); do
                    if docker exec imad-mongo mongosh --quiet --eval 'if(!db.hello().isWritablePrimary)quit(1)' ; then break; fi
                    sleep 1
                  done
            - run: npm run check
            - run: npm test
            - name: Build and verify the combined hosting runtime
              run: |
                  IMAD_HOSTING_MODE=combined NEXT_PUBLIC_API_URL=/api npm run build
                  npm run test:hosted
            - run: npm audit --audit-level=high
