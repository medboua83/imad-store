name: Verify store
on:
    push:
        branches: [Master]
    pull_request:
permissions:
    contents: read
jobs:
    verify:
        runs-on: ubuntu-24.04
        timeout-minutes: 25
        env:
            DATABASE_URL: postgresql://imad_test:imad_test_local@127.0.0.1:5432/postgres
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - run: npm --prefix backend run prisma:generate
            - name: Start isolated PostgreSQL
              run: |
                  docker run -d --name imad-postgres -e POSTGRES_USER=imad_test -e POSTGRES_PASSWORD=imad_test_local -e POSTGRES_DB=postgres -p 127.0.0.1:5432:5432 postgres:16
                  for attempt in $(seq 1 30); do
                    if docker exec imad-postgres pg_isready -U imad_test -d postgres; then break; fi
                    sleep 1
                  done
            - run: npm run check
            - run: npm run test:storefront
            - name: Verify preinstalled UI test browser
              run: google-chrome --version
            - name: Test checkout and dashboard UI with local fixtures
              env:
                  PLAYWRIGHT_CHANNEL: chrome
              run: npm run test:ui
            - uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: isolated-ui-results
                  path: test-results/
                  retention-days: 7
            - run: npm run test:installer
            - run: npm test
            - name: Build and verify the combined hosting runtime
              run: |
                  IMAD_HOSTING_MODE=combined NEXT_PUBLIC_API_URL=/api npm run build
                  npm run test:hosted
            - run: npm audit --audit-level=high
